<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin - Grofast Digital</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/admin.css">

    <style>
        /* Smooth Loading & Animations */
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .spin {
            animation: spin 1s linear infinite;
        }

        .sync-loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem;
            color: #64748b;
        }

        /* Adjusting to match Landing Page aesthetic */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
            color: #1e293b;
        }

        .stat-value {
            color: #2563eb;
        }

        .stat-label {
            color: #64748b;
        }

        .page-title {
            background: white;
            -webkit-background-clip: text;
            -webkit-text-fill-color: white;
        }

        .admin-badge {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body>
    <!-- Animated Background (Matching Landing Page) -->
    <div class="animated-bg">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="grid-overlay"></div>
    </div>

    <main class="main-content admin-content">
        <header class="page-header">
            <a href="../dashboard.html" class="back-btn">
                <i data-lucide="arrow-left"></i>
            </a>
            <h1 class="page-title">Admin Panel</h1>
            <div class="admin-badge">
                <i data-lucide="shield"></i>
            </div>
        </header>

        <!-- Admin Stats -->
        <section class="admin-stats">
            <div class="admin-stat-card glass-card">
                <div class="stat-icon users">
                    <i data-lucide="users"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-value" id="totalUsers">--</span>
                    <span class="stat-label">Total Users</span>
                </div>
            </div>
            <div class="admin-stat-card glass-card">
                <div class="stat-icon attendance">
                    <i data-lucide="calendar-check"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-value" id="todayAttendance">0</span>
                    <span class="stat-label">Today's Attendance</span>
                </div>
            </div>
            <div class="admin-stat-card glass-card">
                <div class="stat-icon updates">
                    <i data-lucide="activity"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-value" id="todayUpdates">0</span>
                    <span class="stat-label">Today's Updates</span>
                </div>
            </div>
        </section>

        <!-- Team Overview -->
        <section class="team-section">
            <div class="section-header">
                <h2 class="section-title">Team Members</h2>
                <button class="btn-primary btn-sm" id="addUserBtn">
                    <i data-lucide="user-plus"></i>
                    <span>Add User</span>
                </button>
            </div>

            <!-- Filter by Field -->
            <div class="field-filter">
                <button class="filter-btn active" data-field="all">All</button>
                <button class="filter-btn" data-field="video_editor" title="Video Editor">🎬</button>
                <button class="filter-btn" data-field="gen_ai" title="Gen AI">🤖</button>
                <button class="filter-btn" data-field="automation" title="Automation">⚙️</button>
                <button class="filter-btn" data-field="digital_marketing" title="Marketing">📢</button>
            </div>

            <div class="team-list" id="teamList">
                <div class="sync-loader">
                    <i data-lucide="refresh-cw" class="spin"
                        style="width: 32px; height: 32px; margin-bottom: 1rem;"></i>
                    <p>Fetching real-time data...</p>
                </div>
            </div>
        </section>

        <!-- Today's Activity -->
        <section class="activity-section">
            <h2 class="section-title">Today's Activity</h2>
            <div class="activity-list" id="todayActivity">
                <div class="sync-loader">
                    <p>Syncing activity log...</p>
                </div>
            </div>
        </section>
    </main>

    <div class="toast-container" id="toastContainer"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
