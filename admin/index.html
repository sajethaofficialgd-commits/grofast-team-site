<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin - Grofast Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>
    <div class="animated-bg">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="grid-overlay"></div>
    </div>

    <main class="main-content admin-content">
        <header class="page-header">
            <a href="../dashboard.html" class="back-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg></a>
            <h1 class="page-title">Admin Panel</h1>
            <div class="admin-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                </svg>
            </div>
        </header>

        <!-- Admin Stats -->
        <section class="admin-stats">
            <div class="admin-stat-card glass-card">
                <div class="stat-icon users">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                        <circle cx="9" cy="7" r="4" />
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                    </svg>
                </div>
                <div class="stat-info">
                    <span class="stat-value" id="totalUsers">0</span>
                    <span class="stat-label">Total Users</span>
                </div>
            </div>
            <div class="admin-stat-card glass-card">
                <div class="stat-icon attendance">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                        <polyline points="22 4 12 14.01 9 11.01" />
                    </svg>
                </div>
                <div class="stat-info">
                    <span class="stat-value" id="todayAttendance">0</span>
                    <span class="stat-label">Today's Attendance</span>
                </div>
            </div>
            <div class="admin-stat-card glass-card">
                <div class="stat-icon updates">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                        <polyline points="14 2 14 8 20 8" />
                    </svg>
                </div>
                <div class="stat-info">
                    <span class="stat-value" id="todayUpdates">0</span>
                    <span class="stat-label">Today's Updates</span>
                </div>
            </div>
        </section>

        <!-- Team Overview -->
        <section class="team-section">
            <div class="section-header">
                <h2 class="section-title">Team Members</h2>
                <button class="btn-primary btn-sm" id="addUserBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                        <line x1="12" y1="5" x2="12" y2="19" />
                        <line x1="5" y1="12" x2="19" y2="12" />
                    </svg>
                    Add User
                </button>
            </div>

            <!-- Filter by Field -->
            <div class="field-filter">
                <button class="filter-btn active" data-field="all">All</button>
                <button class="filter-btn" data-field="video_editor">🎬</button>
                <button class="filter-btn" data-field="gen_ai">🤖</button>
                <button class="filter-btn" data-field="automation">⚙️</button>
                <button class="filter-btn" data-field="digital_marketing">📢</button>
            </div>

            <div class="team-list" id="teamList"></div>
        </section>

        <!-- Today's Activity -->
        <section class="activity-section">
            <h2 class="section-title">Today's Activity</h2>
            <div class="activity-list" id="todayActivity"></div>
        </section>
    </main>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/admin.js"></script>
</body>

</html>
