<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Learning - Grofast Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/employee-dashboard.css">
    <style>
        .learning-container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .learning-header {
            background: rgba(26, 79, 208, 0.05);
            border: 2px solid rgba(0, 212, 255, 0.2);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .learning-header h2 {
            color: #00d4ff;
            margin: 0 0 15px 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .stat-box {
            background: rgba(0, 212, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            border-left: 3px solid #00d4ff;
        }

        .stat-label {
            color: #aaa;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .stat-value {
            color: #00d4ff;
            font-size: 24px;
            font-weight: 700;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
            overflow-x: auto;
        }

        .tab-btn {
            padding: 12px 20px;
            background: transparent;
            color: #aaa;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .tab-btn.active {
            color: #00d4ff;
            border-bottom-color: #00d4ff;
        }

        .tab-btn:hover:not(.active) {
            color: #fff;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .course-card {
            background: rgba(26, 79, 208, 0.08);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .course-card:hover {
            background: rgba(26, 79, 208, 0.12);
            border-color: rgba(0, 212, 255, 0.4);
            transform: translateY(-2px);
        }

        .course-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .course-title {
            color: #00d4ff;
            font-weight: 600;
            margin: 0;
            font-size: 16px;
        }

        .course-badge {
            display: inline-block;
            padding: 4px 10px;
            background: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .course-description {
            color: #aaa;
            font-size: 13px;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .course-progress {
            margin-bottom: 15px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 12px;
            color: #aaa;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #1a4fd0, #00d4ff);
            border-radius: 3px;
        }

        .course-meta {
            display: flex;
            gap: 10px;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 15px;
        }

        .course-action {
            width: 100%;
            padding: 10px;
            background: rgba(0, 212, 255, 0.15);
            color: #00d4ff;
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .course-action:hover {
            background: rgba(0, 212, 255, 0.25);
            border-color: #00d4ff;
        }

        .course-action.completed {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border-color: rgba(16, 185, 129, 0.3);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a2332;
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 16px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-title {
            color: #00d4ff;
            margin: 0;
            font-size: 20px;
        }

        .modal-close {
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 24px;
        }

        .modal-close:hover {
            color: #fff;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #00d4ff;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group textarea,
        .form-group input[type="date"],
        .form-group input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            background: rgba(26, 79, 208, 0.1);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input[type="file"] {
            padding: 8px;
        }

        .form-group textarea:focus,
        .form-group input:focus {
            outline: none;
            border-color: #00d4ff;
            background: rgba(26, 79, 208, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #1a4fd0, #00d4ff);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 212, 255, 0.3);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #fca5a5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }

        .success-message {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.5);
            color: #86efac;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }

        .no-courses {
            text-align: center;
            color: #aaa;
            padding: 60px 20px;
        }

        .page-header {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 20px;
            background: rgba(26, 79, 208, 0.05);
            border-bottom: 1px solid rgba(0, 212, 255, 0.1);
        }

        .back-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 10px;
            color: #00d4ff;
            text-decoration: none;
        }

        .back-btn svg {
            width: 20px;
            height: 20px;
        }

        .page-title {
            flex: 1;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .main-content {
            min-height: 100vh;
            padding-bottom: 100px;
        }

        /* Mobile Navigation */
        .mobile-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid rgba(0, 212, 255, 0.1);
            z-index: 1000;
        }

        .mobile-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.7rem;
            transition: all 0.3s ease;
        }

        .mobile-nav .nav-item svg {
            width: 22px;
            height: 22px;
        }

        .mobile-nav .nav-item.active {
            color: #00d4ff;
        }

        @media (max-width: 768px) {
            .course-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .modal-content {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="animated-bg">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="grid-overlay"></div>
    </div>

    <!-- Mobile Navigation -->
    <nav class="mobile-nav" id="mobileNav">
        <a href="dashboard.html" class="nav-item" data-page="dashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

        <a href="attendance.html" class="nav-item" data-page="attendance">

                <line x1="16" y1="2" x2="16" y2="6"></line>

                <line x1="3" y1="10" x2="21" y2="10"></line>

        </a>
        <a href="learning.html" class="nav-item active" data-page="learning">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>

        </a>
        <a href="work.html" class="nav-item" data-page="work">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Header -->
        <header class="page-header">
            <a href="dashboard.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"></path>
                </svg>

            <h1 class="page-title">Learning</h1>
            <div class="header-date"></div>
        </header>

        <div class="learning-container">
            <!-- Statistics -->

                    <div class="stat-box">

            </div>

    <!-- Completion Modal -->
    <div id="completionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Mark as Complete</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="completionForm">
                <div class="form-group">
                    <label for="completionDate">Completion Date</label>
                    <input type="date" id="completionDate" required>
                </div>
                <div class="form-group">
                    <label for="completionNotes">Notes (optional)</label>
                    <textarea id="completionNotes" placeholder="Add any notes about your completion..."
                        style="min-height: 80px;"></textarea>
                </div>

                    <label for="certificateFile">Upload Certificate (optional)</label>
                    <input type="file" id="certificateFile" accept=".pdf,.jpg,.jpeg,.png">
                </div>

            </form>
        </div>

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Configuration -->
    <script src="../js/config.js"></script>
    <script>
        // Initialize Supabase
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <!-- Learning Script -->
    <script>
        let currentUser = null;
        let currentCourseId = null;
        let allCourses = [];

        // ============================================
        // UTILITY FUNCTIONS
        // ============================================

        function showError(message) {
            const el = document.getElementById('errorMessage');
            el.textContent = message;
            el.style.display = 'block';
            setTimeout(() => {
                el.style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            const el = document.getElementById('successMessage');
            el.textContent = message;
            el.style.display = 'block';
            setTimeout(() => {
                el.style.display = 'none';
            }, 5000);
        }

        // ============================================
        // TAB SWITCHING
        // ============================================

        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });

            // Remove active from all buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // Show selected tab
            document.getElementById(tabName).classList.add('active');

            // Activate button
            event.target.classList.add('active');
        }

        // ============================================
        // LOAD COURSES
        // ============================================

        async function loadCourses() {
            try {
                if (!currentUser) return;

                // Try to load from learning_assignments table
                const { data: assignments, error: assignError } = await supabase
                    .from('learning_assignments')
                    .select('*')
                    .eq('user_id', currentUser.id);

                // Organize by status
                const assigned = [];
                const inProgress = [];
                const completed = [];
                const certified = [];

                if (!assignError && assignments) {
                    assignments.forEach(assign => {
                        const item = {
                            id: assign.course_id || assign.id,
                            title: assign.course_title || assign.title || 'Untitled Course',
                            description: assign.description || 'No description available',
                            level: assign.level || 'Beginner',
                            duration: assign.duration || 'Self-paced',
                            category: assign.category || 'General',
                            assignmentId: assign.id,
                            progress: assign.progress || 0,
                            status: assign.status || 'assigned',
                            completedDate: assign.completed_date,
                            certificateUrl: assign.certificate_url,
                            notes: assign.notes
                        };

                        if (assign.status === 'completed' && assign.certificate_url) {
                            certified.push(item);
                        } else if (assign.status === 'completed') {
                            completed.push(item);
                        } else if (assign.progress > 0) {
                            inProgress.push(item);
                        } else {
                            assigned.push(item);
                        }
                    });
                }

                // Update stats
                document.getElementById('statAssigned').textContent = assigned.length;
                document.getElementById('statCompleted').textContent = completed.length;
                document.getElementById('statInProgress').textContent = inProgress.length;
                document.getElementById('statCertified').textContent = certified.length;

                // Render courses
                renderCourses('assigned', assigned);
                renderCourses('in-progress', inProgress);
                renderCourses('completed', completed);
                renderCourses('certified', certified);

            } catch (error) {
                console.error('Error loading courses:', error);
                // Show empty state instead of error
                ['assigned', 'in-progress', 'completed', 'certified'].forEach(tab => {
                    renderCourses(tab, []);
                });
            }
        }

        function renderCourses(tabId, courses) {
            const containerId = tabId === 'in-progress' ? 'inProgressCourses' :
                tabId === 'completed' ? 'completedCourses' :
                    tabId === 'certified' ? 'certifiedCourses' :
                        'assignedCourses';

            const container = document.getElementById(containerId);
            container.innerHTML = '';

            if (!courses || courses.length === 0) {
                container.innerHTML = `<div class="no-courses">No courses in this category yet.</div>`;
                return;
            }

            courses.forEach(course => {
                const card = document.createElement('div');
                card.className = 'course-card';

                let actionButton = '';
                if (tabId === 'assigned' || tabId === 'in-progress') {
                    actionButton = `<button class="course-action" onclick="openCompletionModal('${course.id}', '${course.title.replace(/'/g, "\\'")}')">Mark Complete</button>`;
                } else if (tabId === 'certified' && course.certificateUrl) {
                    actionButton = `<button class="course-action" onclick="downloadCertificate('${course.certificateUrl}')">View Certificate</button>`;
                } else if (tabId === 'completed') {
                    actionButton = `<button class="course-action" onclick="openCompletionModal('${course.id}', '${course.title.replace(/'/g, "\\'")}')">Upload Certificate</button>`;
                }

                card.innerHTML = `
                    <div class="course-header">
                        <h3 class="course-title">${course.title}</h3>
                        <span class="course-badge">${course.level || 'Beginner'}</span>
                    </div>
                    <p class="course-description">${course.description || 'No description'}</p>
                    <div class="course-progress">
                        <div class="progress-label">
                            <span>Progress</span>
                            <span>${course.progress || 0}%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${course.progress || 0}%"></div>
                        </div>
                    </div>
                    <div class="course-meta">
                        <span>📚 ${course.duration || 'Self-paced'}</span>
                        <span>👥 ${course.category || 'General'}</span>
                    </div>
                    ${actionButton}
                `;

                container.appendChild(card);
            });
        }

        // ============================================
        // COMPLETION MODAL
        // ============================================

        function openCompletionModal(courseId, courseTitle) {
            currentCourseId = courseId;
            document.querySelector('.modal-title').textContent = `Complete: ${courseTitle}`;
            document.getElementById('completionModal').classList.add('active');

            // Set today's date as default
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('completionDate').value = today;
        }

        function closeModal() {
            document.getElementById('completionModal').classList.remove('active');
            document.getElementById('completionForm').reset();
        }

        // ============================================
        // FORM SUBMISSION
        // ============================================

        document.getElementById('completionForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            try {
                const completionDate = document.getElementById('completionDate').value;
                const notes = document.getElementById('completionNotes').value;
                const certificateFile = document.getElementById('certificateFile').files[0];

                if (!currentCourseId) {
                    showError('No course selected');
                    return;
                }

                // Upload certificate if provided
                let certificateUrl = null;
                if (certificateFile) {
                    const filename = `${currentUser.id}_${currentCourseId}_${Date.now()}`;
                    const { data: uploadData, error: uploadError } = await supabase
                        .storage
                        .from('certificates')
                        .upload(filename, certificateFile);

                    if (!uploadError && uploadData) {
                        const { data: urlData } = supabase
                            .storage
                            .from('certificates')
                            .getPublicUrl(filename);
                        certificateUrl = urlData.publicUrl;
                    }
                }

                // Find and update assignment
                const { data, error } = await supabase
                    .from('learning_assignments')
                    .update({
                        status: 'completed',
                        progress: 100,
                        completed_date: completionDate,
                        certificate_url: certificateUrl,
                        notes: notes || null
                    })
                    .eq('user_id', currentUser.id)
                    .eq('course_id', currentCourseId);

                if (error) throw error;

                showSuccess('Course marked as complete!');
                closeModal();
                await loadCourses();

            } catch (error) {
                console.error('Error completing course:', error);
                showError('Error completing course: ' + error.message);
            }
        });

        function downloadCertificate(url) {
            window.open(url, '_blank');
        }

        // ============================================
        // INITIALIZATION
        // ============================================

        async function initializeLearning() {
            try {
                // Check session storage for logged-in user
                const employeeData = sessionStorage.getItem('employeeData');
                const employeeId = sessionStorage.getItem('employeeId');

                if (!employeeData && !employeeId) {
                    window.location.href = '../login.html';
                    return;
                }

                if (employeeData) {
                    currentUser = JSON.parse(employeeData);
                } else {
                    currentUser = { id: employeeId };
                }

                await loadCourses();

            } catch (error) {
                console.error('Initialization error:', error);
                showError('Error initializing page');
            }
        }

        document.addEventListener('DOMContentLoaded', initializeLearning);

        // Close modal when clicking outside
        document.getElementById('completionModal').addEventListener('click', (e) => {
            if (e.target.id === 'completionModal') {
                closeModal();
            }
        });
    </script>
</body>

</html>
