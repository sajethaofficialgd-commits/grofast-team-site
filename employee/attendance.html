<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Attendance - Grofast Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/employee-dashboard.css">
    <style>
        .attendance-container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .attendance-card {
            background: rgba(26, 79, 208, 0.05);
            border: 2px solid rgba(0, 212, 255, 0.2);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .attendance-card h2 {
            color: #00d4ff;
            margin-top: 0;
            margin-bottom: 25px;
        }

        .attendance-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-attend {
            flex: 1;
            min-width: 150px;
            padding: 15px 30px;
            background: linear-gradient(135deg, #1a4fd0, #00d4ff);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .btn-attend:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 212, 255, 0.3);
        }

        .btn-attend:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-camera {
            flex: 1;
            min-width: 150px;
            padding: 15px 30px;
            background: rgba(26, 79, 208, 0.15);
            color: #00d4ff;
            border: 1px solid rgba(0, 212, 255, 0.4);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .btn-camera:hover {
            background: rgba(26, 79, 208, 0.25);
            border-color: #00d4ff;
        }

        .time-display {
            background: rgba(0, 212, 255, 0.1);
            border-left: 3px solid #00d4ff;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            color: #fff;
        }

        .time-display p {
            margin: 8px 0;
            font-size: 14px;
        }

        .time-display strong {
            color: #00d4ff;
        }

        .camera-section {
            margin: 20px 0;
            padding: 20px;
            background: rgba(26, 79, 208, 0.1);
            border-radius: 8px;
            display: none;
        }

        .camera-section.active {
            display: block;
        }

        video,
        canvas {
            width: 100%;
            border-radius: 8px;
            margin: 10px 0;
        }

        .photo-preview {
            width: 100%;
            border-radius: 8px;
            margin: 10px 0;
        }

        .camera-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .camera-buttons button {
            flex: 1;
            min-width: 100px;
            padding: 10px;
            background: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
            border: 1px solid rgba(0, 212, 255, 0.4);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
        }

        .camera-buttons button:hover {
            background: rgba(0, 212, 255, 0.3);
        }

        .history-section {
            background: rgba(26, 79, 208, 0.05);
            border: 2px solid rgba(0, 212, 255, 0.2);
            border-radius: 16px;
            padding: 25px;
        }

        .history-section h3 {
            color: #00d4ff;
            margin: 0 0 20px 0;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
        }

        .history-table th,
        .history-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
            color: #fff;
            font-size: 14px;
        }

        .history-table th {
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            font-weight: 600;
        }

        .history-table tr:hover {
            background: rgba(0, 212, 255, 0.05);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-badge.present {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .status-badge.absent {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #fca5a5;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            display: none;
        }

        .success-message {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.5);
            color: #86efac;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            display: none;
        }

        .no-history {
            text-align: center;
            color: #aaa;
            padding: 40px 20px;
        }

        .page-header {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 20px;
            background: rgba(26, 79, 208, 0.05);
            border-bottom: 1px solid rgba(0, 212, 255, 0.1);
        }

        .back-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 10px;
            color: #00d4ff;
            text-decoration: none;
        }

        .back-btn svg {
            width: 20px;
            height: 20px;
        }

        .page-title {
            flex: 1;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .header-date {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .main-content {
            min-height: 100vh;
            padding-bottom: 100px;
        }

        /* Mobile Navigation */
        .mobile-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid rgba(0, 212, 255, 0.1);
            z-index: 1000;
        }

        .mobile-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.7rem;
            transition: all 0.3s ease;
        }

        .mobile-nav .nav-item svg {
            width: 22px;
            height: 22px;
        }

        .mobile-nav .nav-item.active {
            color: #00d4ff;
        }

        @media (max-width: 768px) {
            .attendance-card {
                padding: 20px;
            }

            .btn-attend,
            .btn-camera {
                min-width: 120px;
                padding: 12px 20px;
            }

            .history-table th,
            .history-table td {
                padding: 8px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>
    <div class="animated-bg">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="grid-overlay"></div>
    </div>

    <!-- Mobile Navigation -->
    <nav class="mobile-nav" id="mobileNav">
        <a href="dashboard.html" class="nav-item" data-page="dashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>Home</span>
        </a>
        <a href="attendance.html" class="nav-item active" data-page="attendance">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <span>Attendance</span>
        </a>
        <a href="learning.html" class="nav-item" data-page="learning">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
            <span>Learning</span>
        </a>
        <a href="work.html" class="nav-item" data-page="work">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
            <span>Work</span>
        </a>
        <a href="chat.html" class="nav-item" data-page="chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            <span>Chat</span>
        </a>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Header -->
        <header class="page-header">
            <a href="dashboard.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"></path>
                </svg>
            </a>
            <h1 class="page-title">Attendance</h1>
            <div class="header-date" id="currentDate"></div>
        </header>

        <div class="attendance-container">
            <!-- Error/Success Messages -->
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <!-- Today's Attendance -->
            <div class="attendance-card">
                <h2>Today's Check-In/Out</h2>

                <div id="attendanceStatus">
                    <p style="color: #aaa; text-align: center;">Loading today's attendance...</p>
                </div>

                <div class="attendance-buttons">
                    <button id="checkInBtn" class="btn-attend" onclick="handleCheckIn()">📍 Check In</button>
                    <button id="checkOutBtn" class="btn-attend" disabled onclick="handleCheckOut()">🔓 Check
                        Out</button>
                    <button class="btn-camera" onclick="toggleCamera()">📷 Camera</button>
                </div>

                <!-- Camera Section -->
                <div class="camera-section" id="cameraSection">
                    <h3 style="color: #00d4ff; margin-top: 0;">Camera Capture</h3>
                    <video id="videoStream" autoplay playsinline></video>
                    <canvas id="photoCanvas" style="display: none;"></canvas>
                    <img id="photoPreview" class="photo-preview" style="display: none;">
                    <div class="camera-buttons">
                        <button onclick="capturePhoto()">📸 Capture Photo</button>
                        <button onclick="retakePhoto()">🔄 Retake</button>
                        <button onclick="stopCamera()">❌ Close Camera</button>
                    </div>
                </div>
            </div>

            <!-- Attendance History -->
            <div class="history-section">
                <h3>Attendance History (Last 30 Days)</h3>
                <div id="historyContent">
                    <div class="no-history">Loading history...</div>
                </div>
            </div>
        </div>
    </main>

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Configuration -->
    <script src="../js/config.js"></script>
    <script>
        // Initialize Supabase
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <!-- Attendance Script -->
    <script>
        let currentUser = null;
        let capturedPhotoBlob = null;
        let mediaStream = null;

        // ============================================
        // UTILITY FUNCTIONS
        // ============================================

        function formatDateIST(date = new Date()) {
            const istDate = new Date(date.toLocaleString('en-US', {
                timeZone: 'Asia/Kolkata'
            }));
            return istDate.toLocaleDateString('en-IN', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        function formatTimeIST(date) {
            const istDate = new Date(date.toLocaleString('en-US', {
                timeZone: 'Asia/Kolkata'
            }));
            return istDate.toLocaleTimeString('en-IN', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            });
        }

        function formatTimeDB(date) {
            const istDate = new Date(date.toLocaleString('en-US', {
                timeZone: 'Asia/Kolkata'
            }));
            const hours = String(istDate.getHours()).padStart(2, '0');
            const minutes = String(istDate.getMinutes()).padStart(2, '0');
            return `${hours}:${minutes}`;
        }

        function getTodayIST() {
            const istDate = new Date(new Date().toLocaleString('en-US', {
                timeZone: 'Asia/Kolkata'
            }));
            const year = istDate.getFullYear();
            const month = String(istDate.getMonth() + 1).padStart(2, '0');
            const day = String(istDate.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function updateDateDisplay() {
            document.getElementById('currentDate').textContent = formatDateIST();
        }

        function showError(message) {
            const el = document.getElementById('errorMessage');
            el.textContent = message;
            el.style.display = 'block';
            setTimeout(() => {
                el.style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            const el = document.getElementById('successMessage');
            el.textContent = message;
            el.style.display = 'block';
            setTimeout(() => {
                el.style.display = 'none';
            }, 5000);
        }

        // ============================================
        // LOAD TODAY'S ATTENDANCE
        // ============================================

        async function loadTodayAttendance() {
            try {
                if (!currentUser) return;

                const { data, error } = await supabase
                    .from('attendance')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .eq('date', getTodayIST())
                    .single();

                if (error && error.code !== 'PGRST116') throw error;

                const statusEl = document.getElementById('attendanceStatus');
                const checkInBtn = document.getElementById('checkInBtn');
                const checkOutBtn = document.getElementById('checkOutBtn');

                if (data) {
                    const checkInTime = data.check_in_time || 'Pending...';
                    const checkOutTime = data.check_out_time || 'Pending...';

                    statusEl.innerHTML = `
                        <div class="time-display">
                            <p><strong>Check-In:</strong> ${checkInTime}</p>
                            <p><strong>Check-Out:</strong> ${checkOutTime}</p>
                            <p><strong>Status:</strong> <span class="status-badge ${data.status}">${(data.status || 'present').toUpperCase()}</span></p>
                        </div>
                    `;

                    checkInBtn.disabled = true;
                    checkOutBtn.disabled = !data.check_in_time || !!data.check_out_time;
                } else {
                    statusEl.innerHTML = `
                        <div class="time-display">
                            <p>No check-in yet today. Click "Check In" to get started!</p>
                        </div>
                    `;
                    checkInBtn.disabled = false;
                    checkOutBtn.disabled = true;
                }
            } catch (error) {
                console.error('Error loading attendance:', error);
                showError('Error loading today\'s attendance');
            }
        }

        // ============================================
        // CHECK-IN HANDLER
        // ============================================

        async function handleCheckIn() {
            try {
                if (!currentUser) {
                    showError('User not logged in');
                    return;
                }

                const today = getTodayIST();
                const now = new Date();
                const timeDB = formatTimeDB(now);

                // Check if already checked in
                const { data: existing, error: checkError } = await supabase
                    .from('attendance')
                    .select('id')
                    .eq('user_id', currentUser.id)
                    .eq('date', today)
                    .single();

                if (checkError && checkError.code !== 'PGRST116') throw checkError;

                if (existing) {
                    showError('Already checked in today');
                    return;
                }

                // Upload photo if captured
                let photoUrl = null;
                if (capturedPhotoBlob) {
                    const filename = `${currentUser.id}_${Date.now()}.jpg`;
                    const { data: uploadData, error: uploadError } = await supabase
                        .storage
                        .from('photos')
                        .upload(`attendance/${filename}`, capturedPhotoBlob);

                    if (!uploadError && uploadData) {
                        const { data: urlData } = supabase
                            .storage
                            .from('photos')
                            .getPublicUrl(`attendance/${filename}`);
                        photoUrl = urlData.publicUrl;
                    }
                }

                // Insert attendance record
                const { data, error } = await supabase
                    .from('attendance')
                    .insert([{
                        user_id: currentUser.id,
                        user_name: currentUser.name || currentUser.email,
                        date: today,
                        check_in_time: timeDB,
                        work_mode: 'Office',
                        status: 'present',
                        photo_url: photoUrl
                    }]);

                if (error) throw error;

                showSuccess('✓ Check-in successful!');
                capturedPhotoBlob = null;
                stopCamera();
                await loadTodayAttendance();
                await loadAttendanceHistory();

            } catch (error) {
                console.error('Check-in error:', error);
                showError('Error during check-in: ' + error.message);
            }
        }

        // ============================================
        // CHECK-OUT HANDLER
        // ============================================

        async function handleCheckOut() {
            try {
                if (!currentUser) {
                    showError('User not logged in');
                    return;
                }

                const today = getTodayIST();
                const now = new Date();
                const timeDB = formatTimeDB(now);

                // Update attendance record
                const { data, error } = await supabase
                    .from('attendance')
                    .update({
                        check_out_time: timeDB
                    })
                    .eq('user_id', currentUser.id)
                    .eq('date', today);

                if (error) throw error;

                showSuccess('✓ Check-out successful!');
                await loadTodayAttendance();
                await loadAttendanceHistory();

            } catch (error) {
                console.error('Check-out error:', error);
                showError('Error during check-out: ' + error.message);
            }
        }

        // ============================================
        // CAMERA FUNCTIONS
        // ============================================

        async function startCamera() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user' },
                    audio: false
                });
                const video = document.getElementById('videoStream');
                video.srcObject = mediaStream;
            } catch (error) {
                console.error('Camera error:', error);
                showError('Camera not available. You can still check-in without photo.');
            }
        }

        function capturePhoto() {
            const video = document.getElementById('videoStream');
            const canvas = document.getElementById('photoCanvas');
            const ctx = canvas.getContext('2d');

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);

            canvas.toBlob((blob) => {
                capturedPhotoBlob = blob;
                const preview = document.getElementById('photoPreview');
                preview.src = canvas.toDataURL('image/jpeg');
                preview.style.display = 'block';
                video.style.display = 'none';
            }, 'image/jpeg', 0.95);
        }

        function retakePhoto() {
            const video = document.getElementById('videoStream');
            const preview = document.getElementById('photoPreview');
            video.style.display = 'block';
            preview.style.display = 'none';
            capturedPhotoBlob = null;
        }

        function stopCamera() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }
            document.getElementById('cameraSection').classList.remove('active');
            document.getElementById('videoStream').style.display = 'block';
            document.getElementById('photoPreview').style.display = 'none';
        }

        function toggleCamera() {
            const section = document.getElementById('cameraSection');
            if (section.classList.contains('active')) {
                stopCamera();
            } else {
                section.classList.add('active');
                startCamera();
            }
        }

        // ============================================
        // LOAD ATTENDANCE HISTORY
        // ============================================

        async function loadAttendanceHistory() {
            try {
                if (!currentUser) return;

                const { data, error } = await supabase
                    .from('attendance')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .order('date', { ascending: false })
                    .limit(30);

                if (error) throw error;

                const historyContent = document.getElementById('historyContent');
                historyContent.innerHTML = '';

                if (!data || data.length === 0) {
                    historyContent.innerHTML = '<div class="no-history">No attendance records yet.</div>';
                    return;
                }

                let html = `
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Check-In</th>
                                <th>Check-Out</th>
                                <th>Hours</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                data.forEach(record => {
                    const date = new Date(record.date).toLocaleDateString('en-IN');
                    const checkIn = record.check_in_time || '—';
                    const checkOut = record.check_out_time || '—';

                    let hours = '—';
                    if (record.check_in_time && record.check_out_time) {
                        const inTime = new Date(`2000-01-01 ${record.check_in_time}`);
                        const outTime = new Date(`2000-01-01 ${record.check_out_time}`);
                        const diff = (outTime - inTime) / (1000 * 60 * 60);
                        hours = diff.toFixed(2) + ' hrs';
                    }

                    html += `
                        <tr>
                            <td>${date}</td>
                            <td>${checkIn}</td>
                            <td>${checkOut}</td>
                            <td>${hours}</td>
                            <td><span class="status-badge ${record.status || 'present'}">${(record.status || 'present').toUpperCase()}</span></td>
                        </tr>
                    `;
                });

                html += `
                        </tbody>
                    </table>
                `;

                historyContent.innerHTML = html;

            } catch (error) {
                console.error('Error loading history:', error);
                showError('Error loading attendance history');
            }
        }

        // ============================================
        // INITIALIZATION
        // ============================================

        async function initializeAttendance() {
            try {
                // Check session storage for logged-in user
                const employeeData = sessionStorage.getItem('employeeData');
                const employeeId = sessionStorage.getItem('employeeId');

                if (!employeeData && !employeeId) {
                    window.location.href = '../login.html';
                    return;
                }

                if (employeeData) {
                    currentUser = JSON.parse(employeeData);
                } else {
                    currentUser = { id: employeeId };
                }

                updateDateDisplay();
                await loadTodayAttendance();
                await loadAttendanceHistory();

            } catch (error) {
                console.error('Initialization error:', error);
                showError('Error initializing page');
            }
        }

        document.addEventListener('DOMContentLoaded', initializeAttendance);
    </script>
</body>

</html>
