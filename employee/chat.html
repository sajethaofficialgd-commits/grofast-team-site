<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat - Grofast Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/employee-dashboard.css">
    <style>
        .chat-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 0;
            height: calc(100vh - 120px);
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .chat-sidebar {
            background: rgba(26, 79, 208, 0.08);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 12px 0 0 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
        }

        .sidebar-header h2 {
            color: #00d4ff;
            margin: 0 0 15px 0;
            font-size: 16px;
        }

        .btn-new-chat {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #1a4fd0, #00d4ff);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .btn-new-chat:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 212, 255, 0.3);
        }

        .conversations-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .conversation-item {
            padding: 12px;
            margin-bottom: 8px;
            background: rgba(0, 212, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.1);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #fff;
        }

        .conversation-item:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: rgba(0, 212, 255, 0.3);
        }

        .conversation-item.active {
            background: rgba(0, 212, 255, 0.2);
            border-color: #00d4ff;
        }

        .conversation-title {
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 13px;
            color: #00d4ff;
        }

        .conversation-preview {
            font-size: 12px;
            color: #aaa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-main {
            background: rgba(26, 79, 208, 0.03);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 0 12px 12px 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-title {
            color: #00d4ff;
            margin: 0;
            font-size: 18px;
        }

        .chat-participants {
            font-size: 12px;
            color: #aaa;
            margin-top: 5px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .message.own {
            justify-content: flex-end;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a4fd0, #00d4ff);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
            flex-shrink: 0;
        }

        .message.own .message-avatar {
            background: rgba(16, 185, 129, 0.3);
            color: #10b981;
        }

        .message-bubble {
            max-width: 60%;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.2);
            padding: 12px 15px;
            border-radius: 12px;
            color: #fff;
            word-wrap: break-word;
        }

        .message.own .message-bubble {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
            border-radius: 12px 0 12px 12px;
        }

        .message:not(.own) .message-bubble {
            border-radius: 0 12px 12px 12px;
        }

        .message-sender {
            font-size: 12px;
            color: #00d4ff;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .message.own .message-sender {
            color: #10b981;
            text-align: right;
        }

        .message-text {
            font-size: 14px;
            line-height: 1.4;
        }

        .message-time {
            font-size: 11px;
            color: #aaa;
            margin-top: 4px;
        }

        .chat-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #aaa;
            text-align: center;
            padding: 40px;
        }

        .chat-input-area {
            padding: 20px;
            border-top: 1px solid rgba(0, 212, 255, 0.2);
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            background: rgba(26, 79, 208, 0.1);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            resize: none;
            max-height: 100px;
            transition: all 0.3s ease;
        }

        .chat-input:focus {
            outline: none;
            border-color: #00d4ff;
            background: rgba(26, 79, 208, 0.15);
        }

        .chat-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .btn-send {
            padding: 12px 20px;
            background: linear-gradient(135deg, #1a4fd0, #00d4ff);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 212, 255, 0.3);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #fca5a5;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 20px;
            display: none;
        }

        .success-message {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.5);
            color: #86efac;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 20px;
            display: none;
        }

        .no-conversations {
            text-align: center;
            color: #aaa;
            padding: 40px 20px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a2332;
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 16px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-title {
            color: #00d4ff;
            margin: 0;
            font-size: 18px;
        }

        .modal-close {
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #00d4ff;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            background: rgba(26, 79, 208, 0.1);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #00d4ff;
            background: rgba(26, 79, 208, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #1a4fd0, #00d4ff);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 212, 255, 0.3);
        }

        .page-header {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 20px;
            background: rgba(26, 79, 208, 0.05);
            border-bottom: 1px solid rgba(0, 212, 255, 0.1);
        }

        .back-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 10px;
            color: #00d4ff;
            text-decoration: none;
        }

        .back-btn svg {
            width: 20px;
            height: 20px;
        }

        .page-title {
            flex: 1;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .main-content {
            min-height: 100vh;
            padding-bottom: 100px;
        }

        /* Mobile Navigation */
        .mobile-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid rgba(0, 212, 255, 0.1);
            z-index: 1000;
        }

        .mobile-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.7rem;
            transition: all 0.3s ease;
        }

        .mobile-nav .nav-item svg {
            width: 22px;
            height: 22px;
        }

        .mobile-nav .nav-item.active {
            color: #00d4ff;
        }

        @media (max-width: 1024px) {
            .chat-container {
                grid-template-columns: 250px 1fr;
            }

            .message-bubble {
                max-width: 75%;
            }
        }

        @media (max-width: 768px) {
            .chat-container {
                grid-template-columns: 1fr;
                height: auto;
            }

            .chat-sidebar {
                display: none;
                position: absolute;
                left: 0;
                top: 0;
                width: 250px;
                height: 100%;
                z-index: 100;
            }

            .chat-sidebar.active {
                display: flex;
            }

            .chat-main {
                border-radius: 12px;
                min-height: 60vh;
            }

            .message-bubble {
                max-width: 85%;
            }
        }
    </style>
</head>

<body>

    </div>

        <!-- Header -->

    <!-- New Chat Modal -->
    <div id="newChatModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Start New Conversation</h2>

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Configuration -->
    <script src="../js/config.js"></script>
    <script>
        // Initialize Supabase
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <!-- Chat Script -->
    <script>
        let currentUser = null;
        let currentConversation = null;
        let allConversations = [];

        // ============================================
        // UTILITY FUNCTIONS
        // ============================================

        function showError(message) {
            const el = document.getElementById('errorMessage');
            el.textContent = message;
            el.style.display = 'block';
            setTimeout(() => {
                el.style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            const el = document.getElementById('successMessage');
            el.textContent = message;
            el.style.display = 'block';
            setTimeout(() => {
                el.style.display = 'none';
            }, 5000);
        }

        function formatTimeIST(date) {
            const istDate = new Date(date.toLocaleString('en-US', {
                timeZone: 'Asia/Kolkata'
            }));
            return istDate.toLocaleTimeString('en-IN', {
                hour: '2-digit',
                minute: '2-digit',
                hour12: true
            });
        }

        function getInitials(name) {
            if (!name) return 'U';
            return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
        }

        // ============================================
        // LOAD CONVERSATIONS
        // ============================================

        async function loadConversations() {
            try {
                if (!currentUser) return;

                // Try to load from messages table (team chat)
                const { data, error } = await supabase
                    .from('messages')
                    .select('*')
                    .eq('is_team_chat', true)
                    .order('created_at', { ascending: false })
                    .limit(50);

                if (!error && data) {
                    // Group messages by "conversation" (we'll use team chat as one conversation)
                    allConversations = [{
                        id: 'team',
                        title: 'Team Chat',
                        description: 'General team discussion',
                        messages: data
                    }];
                } else {
                    allConversations = [];
                }

                renderConversations();

            } catch (error) {
                console.error('Error loading conversations:', error);
                // Show empty state instead of error
                allConversations = [];
                renderConversations();
            }
        }

        function renderConversations() {
            const list = document.getElementById('conversationsList');
            list.innerHTML = '';

            if (!allConversations || allConversations.length === 0) {
                list.innerHTML = '<div class="no-conversations">No conversations yet. Create one to start!</div>';
                return;
            }

            allConversations.forEach(conv => {
                const item = document.createElement('div');
                item.className = 'conversation-item';
                if (currentConversation && currentConversation.id === conv.id) {
                    item.classList.add('active');
                }
                item.onclick = () => selectConversation(conv);

                item.innerHTML = `
                    <div class="conversation-title">${conv.title}</div>
                    <div class="conversation-preview">${conv.description || 'No description'}</div>
                `;

                list.appendChild(item);
            });
        }

        // ============================================
        // SELECT CONVERSATION
        // ============================================

        async function selectConversation(conversation) {
            currentConversation = conversation;
            renderConversations();
            await loadMessages();
        }

        // ============================================
        // LOAD MESSAGES
        // ============================================

        async function loadMessages() {
            try {
                if (!currentConversation) return;

                let messages = [];

                if (currentConversation.id === 'team') {
                    // Load team chat messages
                    const { data, error } = await supabase
                        .from('messages')
                        .select('*')
                        .eq('is_team_chat', true)
                        .order('created_at', { ascending: true })
                        .limit(100);

                    if (!error) {
                        messages = data || [];
                    }
                }

                renderChatView(messages);

            } catch (error) {
                console.error('Error loading messages:', error);
                renderChatView([]);
            }
        }

        function renderChatView(messages) {
            const content = document.getElementById('chatContent');

            // Create chat header
            const header = document.createElement('div');
            header.className = 'chat-header';
            header.innerHTML = `
                <div>
                    <div class="chat-title">${currentConversation.title}</div>
                    <div class="chat-participants">${currentConversation.description || 'Team conversation'}</div>
                </div>
            `;

            // Create messages area
            const messagesArea = document.createElement('div');
            messagesArea.className = 'chat-messages';
            messagesArea.id = 'messagesArea';

            if (!messages || messages.length === 0) {
                messagesArea.innerHTML = '<div class="chat-empty">No messages yet. Start the conversation!</div>';
            } else {
                messages.forEach(msg => {
                    const isOwn = String(msg.user_id) === String(currentUser.id);
                    const messageEl = document.createElement('div');
                    messageEl.className = 'message' + (isOwn ? ' own' : '');

                    const avatar = document.createElement('div');
                    avatar.className = 'message-avatar';
                    avatar.textContent = getInitials(msg.user_name);

                    const bubble = document.createElement('div');
                    bubble.className = 'message-bubble';

                    const sender = document.createElement('div');
                    sender.className = 'message-sender';
                    sender.textContent = msg.user_name || 'Unknown';

                    const text = document.createElement('div');
                    text.className = 'message-text';
                    text.textContent = msg.content;

                    const time = document.createElement('div');
                    time.className = 'message-time';
                    time.textContent = formatTimeIST(new Date(msg.created_at));

                    bubble.appendChild(sender);
                    bubble.appendChild(text);
                    bubble.appendChild(time);

                    if (isOwn) {
                        messageEl.appendChild(bubble);
                        messageEl.appendChild(avatar);
                    } else {
                        messageEl.appendChild(avatar);
                        messageEl.appendChild(bubble);
                    }

                    messagesArea.appendChild(messageEl);
                });
            }

            // Create input area
            const inputArea = document.createElement('div');
            inputArea.className = 'chat-input-area';
            inputArea.innerHTML = `
                <textarea class="chat-input" id="messageInput" placeholder="Type your message..." rows="1"></textarea>
                <button class="btn-send" onclick="sendMessage()">Send</button>
            `;

            // Clear and rebuild
            content.innerHTML = '';
            content.appendChild(header);
            content.appendChild(messagesArea);
            content.appendChild(inputArea);

            // Scroll to bottom
            messagesArea.scrollTop = messagesArea.scrollHeight;

            // Auto-resize textarea
            const textarea = document.getElementById('messageInput');
            textarea.addEventListener('input', () => {
                textarea.style.height = 'auto';
                textarea.style.height = Math.min(textarea.scrollHeight, 100) + 'px';
            });

            // Send on Enter (without Shift)
            textarea.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
        }

        // ============================================
        // SEND MESSAGE
        // ============================================

        async function sendMessage() {
            try {
                if (!currentConversation || !currentUser) {
                    showError('No conversation selected');
                    return;
                }

                const textarea = document.getElementById('messageInput');
                const message = textarea.value.trim();

                if (!message) {
                    showError('Message cannot be empty');
                    return;
                }

                // Insert message
                const { data, error } = await supabase
                    .from('messages')
                    .insert([{
                        user_id: currentUser.id,
                        user_name: currentUser.name || currentUser.email || 'User',
                        content: message,
                        is_team_chat: true,
                        type: 'text'
                    }]);

                if (error) throw error;

                textarea.value = '';
                textarea.style.height = 'auto';
                await loadMessages();

            } catch (error) {
                console.error('Error sending message:', error);
                showError('Error sending message: ' + error.message);
            }
        }

        // ============================================
        // NEW CHAT MODAL
        // ============================================

        function openNewChatModal() {
            document.getElementById('newChatModal').classList.add('active');
        }

        function closeNewChatModal() {
            document.getElementById('newChatModal').classList.remove('active');
            document.getElementById('newChatForm').reset();
        }

        document.getElementById('newChatForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            try {
                const title = document.getElementById('conversationTitle').value;
                const description = document.getElementById('conversationDesc').value;

                // For now, just add to team chat
                showSuccess('Conversation created! Using Team Chat.');
                closeNewChatModal();

                // Auto-select team chat
                if (allConversations.length > 0) {
                    await selectConversation(allConversations[0]);
                }

            } catch (error) {
                console.error('Error creating conversation:', error);
                showError('Error creating conversation: ' + error.message);
            }
        });

        // ============================================
        // INITIALIZATION
        // ============================================

        async function initializeChat() {
            try {
                // Check session storage for logged-in user
                const employeeData = sessionStorage.getItem('employeeData');
                const employeeId = sessionStorage.getItem('employeeId');
                const employeeName = sessionStorage.getItem('employeeName');

                if (!employeeData && !employeeId) {
                    window.location.href = '../login.html';
                    return;
                }

                if (employeeData) {
                    currentUser = JSON.parse(employeeData);
                } else {
                    currentUser = {
                        id: employeeId,
                        name: employeeName || 'User'
                    };
                }

                await loadConversations();

                // Auto-select first conversation if available
                if (allConversations.length > 0) {
                    await selectConversation(allConversations[0]);
                }

            } catch (error) {
                console.error('Initialization error:', error);
                showError('Error initializing chat');
            }
        }

        document.addEventListener('DOMContentLoaded', initializeChat);

        // Close modal when clicking outside
        document.getElementById('newChatModal').addEventListener('click', (e) => {
            if (e.target.id === 'newChatModal') {
                closeNewChatModal();
            }
        });
    </script>
</body>
