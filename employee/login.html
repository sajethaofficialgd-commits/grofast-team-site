<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Login | Team Management Portal</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>
    <!-- Animated Background -->
    <div class="animated-bg">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
        <div class="grid-overlay"></div>
    </div>

    <!-- Login Container -->
    <div class="auth-container">
        <!-- Back Button -->
        <a href="../index.html" class="back-link">
            <i data-lucide="arrow-left"></i>
            <span>Back to Home</span>
        </a>

        <!-- Login Card -->
        <div class="auth-card glass-card">
            <div class="auth-header">
                <div class="auth-icon employee-auth-icon">
                    <i data-lucide="user-circle"></i>
                </div>
                <h1 class="auth-title">Team Login</h1>
                <p class="auth-subtitle">Sign in to access your personal dashboard</p>
            </div>

            <form id="employeeLoginForm" class="auth-form">
                <div class="form-group">
                    <label class="form-label">
                        <i data-lucide="mail" class="label-icon"></i>
                        Email
                    </label>
                    <div class="input-wrapper">
                        <input type="email" id="email" class="form-input" placeholder="Enter your email" required>
                        <div class="input-glow"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i data-lucide="lock" class="label-icon"></i>
                        Password
                    </label>
                    <div class="input-wrapper password-wrapper">
                        <input type="password" id="password" class="form-input" placeholder="Enter your password"
                            required>
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                            <i data-lucide="eye" id="eyeIcon"></i>
                        </button>
                        <div class="input-glow"></div>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="rememberMe">
                        <span class="checkmark"></span>
                        <span class="checkbox-label">Remember me</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-full btn-lg"
                    style="background: var(--gradient-accent); color: var(--bg-dark);">
                    <i data-lucide="log-in"></i>
                    <span>Sign In</span>
                </button>

                <div id="errorMessage" class="error-message hidden">
                    <i data-lucide="alert-circle"></i>
                    <span>Invalid email or password</span>
                </div>
            </form>

            <div class="auth-footer">
                <div class="secure-badge">
                    <i data-lucide="lock"></i>
                    <span>Secure Team Access</span>
                </div>
            </div>

        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="../js/config.js"></script>
    <script src="../js/admin-data.js"></script>
    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Initialize Supabase client
        let supabaseClient = null;
        if (typeof supabase !== 'undefined' && SUPABASE_URL && SUPABASE_ANON_KEY !== 'YOUR_SUPABASE_ANON_KEY') {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            console.log('✅ Supabase connected!');
        }

        // Toggle password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.setAttribute('data-lucide', 'eye-off');
            } else {
                passwordInput.type = 'password';
                eyeIcon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        // Form submission
        document.getElementById('employeeLoginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMessage = document.getElementById('errorMessage');
            const submitBtn = this.querySelector('button[type="submit"]');

            // Show loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i data-lucide="loader-2" class="spin"></i> <span>Signing in...</span>';
            lucide.createIcons();

            let employee = null;

            // 1. First check Supabase database
            if (supabaseClient) {
                try {
                    const { data, error } = await supabaseClient
                        .from('employees')
                        .select('*')
                        .ilike('email', email)
                        .eq('password', password)
                        .single();

                    if (data && !error) {
                        employee = data;
                        console.log('✅ Found employee in database');
                    }
                } catch (err) {
                    console.log('Database check:', err.message);
                }
            }

            // 2. If not found in database, check DEMO_USERS from config.js
            if (!employee && typeof DEMO_USERS !== 'undefined') {
                const demoUser = DEMO_USERS.find(user =>
                    user.email.toLowerCase() === email.toLowerCase() &&
                    user.password === password
                );
                if (demoUser) {
                    employee = {
                        id: demoUser.id,
                        name: demoUser.name,
                        email: demoUser.email,
                        role: demoUser.role,
                        position: demoUser.position,
                        department: demoUser.department,
                        phone: demoUser.phone,
                        status: 'active'
                    };
                    console.log('✅ Found employee in DEMO_USERS');
                }
            }

            // 3. Fallback to localStorage
            if (!employee) {
                const employees = getEmployees();
                employee = employees.find(emp =>
                    emp.email.toLowerCase() === email.toLowerCase() &&
                    emp.password === password
                );
                if (employee) console.log('✅ Found employee in localStorage');
            }

            // Reset button
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i data-lucide="log-in"></i> <span>Sign In</span>';
            lucide.createIcons();

            if (employee) {
                // Check if account is active
                if (employee.status === 'inactive') {
                    errorMessage.querySelector('span').textContent = 'Your account is inactive. Contact admin.';
                    errorMessage.classList.remove('hidden');
                    return;
                }

                // Add activity log
                addActivity('login', employee.name, 'Logged into the system');

                // Store session
                sessionStorage.setItem('employeeLoggedIn', 'true');
                sessionStorage.setItem('employeeId', employee.id);
                sessionStorage.setItem('employeeName', employee.name);
                sessionStorage.setItem('employeeData', JSON.stringify(employee));

                // Redirect to dashboard
                showToast('Login successful!', 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            } else {
                errorMessage.querySelector('span').textContent = 'Invalid email or password';
                errorMessage.classList.remove('hidden');
                setTimeout(() => {
                    errorMessage.classList.add('hidden');
                }, 3000);
            }
        });

        // Toast notification
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `
                <div class="toast-icon">
                    <i data-lucide="${type === 'success' ? 'check-circle' : 'info'}"></i>
                </div>
                <div class="toast-content">
                    <span class="toast-message">${message}</span>
                </div>
            `;
            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
    </script>

    <style>
        .demo-info {
            margin-top: var(--space-6);
            padding: var(--space-4);
            background: rgba(0, 212, 255, 0.08);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: var(--radius-lg);
            text-align: center;
        }

        .demo-title {
            font-size: var(--font-size-sm);
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: var(--space-2);
        }

        .demo-cred {
            font-size: var(--font-size-xs);
            color: var(--text-muted);
            font-family: monospace;
        }

        .spin {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</body>

</html>
