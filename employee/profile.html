<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Team Management Portal</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/employee-profile.css">
</head>

<body>
    <!-- Animated Background -->
    <div class="animated-bg">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
        <div class="grid-overlay"></div>
    </div>

    <!-- Main Container -->
    <div class="profile-container">
        <!-- Header -->
        <header class="profile-header glass-card">
            <div class="header-left">
                <a href="../index.html" class="back-btn">
                    <i data-lucide="arrow-left"></i>
                </a>
                <div class="header-title">
                    <h1>My Profile</h1>
                    <p>Manage your personal information</p>
                </div>
            </div>
            <div class="header-right">
                <button class="logout-btn" onclick="logout()">
                    <i data-lucide="log-out"></i>
                    <span>Logout</span>
                </button>
            </div>
        </header>

        <!-- Profile Content -->
        <div class="profile-content">
            <!-- Profile Card -->
            <div class="profile-card glass-card">
                <div class="profile-hero">
                    <div class="profile-avatar" id="profileAvatar">
                        <!-- Initials will be inserted here -->
                    </div>
                    <div class="profile-info">
                        <h2 class="profile-name" id="profileName">Loading...</h2>
                        <p class="profile-role" id="profileRole">Loading...</p>
                        <span class="profile-badge" id="profileBadge">
                            <i data-lucide="check-circle"></i>
                            Active
                        </span>
                    </div>
                </div>

                <div class="profile-stats">
                    <div class="stat-item">
                        <div class="stat-icon">
                            <i data-lucide="calendar"></i>
                        </div>
                        <div class="stat-content">
                            <p class="stat-label">Member Since</p>
                            <p class="stat-value" id="joinDate">-</p>
                        </div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-icon">
                            <i data-lucide="briefcase"></i>
                        </div>
                        <div class="stat-content">
                            <p class="stat-label">Department</p>
                            <p class="stat-value" id="department">-</p>
                        </div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-icon">
                            <i data-lucide="clock"></i>
                        </div>
                        <div class="stat-content">
                            <p class="stat-label">Last Login</p>
                            <p class="stat-value" id="lastLogin">-</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Details Section -->
            <div class="details-grid">
                <!-- Personal Information -->
                <div class="details-card glass-card">
                    <div class="card-header">
                        <h3 class="card-title">
                            <i data-lucide="user"></i>
                            Personal Information
                        </h3>
                        <button class="edit-btn" onclick="toggleEdit('personal')">
                            <i data-lucide="edit-2"></i>
                            <span>Edit</span>
                        </button>
                    </div>
                    <form id="personalForm" class="details-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Full Name</label>
                                <input type="text" id="editName" class="form-input" disabled>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Role / Position</label>
                                <input type="text" id="editRole" class="form-input" disabled>
                            </div>
                        </div>
                        <div class="form-actions hidden" id="personalActions">
                            <button type="button" class="btn btn-secondary"
                                onclick="cancelEdit('personal')">Cancel</button>
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </div>
                    </form>
                </div>

                <!-- Contact Information -->
                <div class="details-card glass-card">
                    <div class="card-header">
                        <h3 class="card-title">
                            <i data-lucide="phone"></i>
                            Contact Information
                        </h3>
                        <button class="edit-btn" onclick="toggleEdit('contact')">
                            <i data-lucide="edit-2"></i>
                            <span>Edit</span>
                        </button>
                    </div>
                    <form id="contactForm" class="details-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Email Address</label>
                                <input type="email" id="editEmail" class="form-input" disabled>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Phone Number</label>
                                <input type="tel" id="editPhone" class="form-input" disabled>
                            </div>
                        </div>
                        <div class="form-actions hidden" id="contactActions">
                            <button type="button" class="btn btn-secondary"
                                onclick="cancelEdit('contact')">Cancel</button>
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </div>
                    </form>
                </div>

                <!-- Security -->
                <div class="details-card glass-card">
                    <div class="card-header">
                        <h3 class="card-title">
                            <i data-lucide="shield"></i>
                            Security
                        </h3>
                    </div>
                    <form id="securityForm" class="details-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Current Password</label>
                                <input type="password" id="currentPassword" class="form-input"
                                    placeholder="Enter current password">
                            </div>
                            <div class="form-group">
                                <label class="form-label">New Password</label>
                                <input type="password" id="newPassword" class="form-input"
                                    placeholder="Enter new password">
                            </div>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">
                                <i data-lucide="lock"></i>
                                Update Password
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Activity Log -->
                <div class="details-card glass-card full-width">
                    <div class="card-header">
                        <h3 class="card-title">
                            <i data-lucide="activity"></i>
                            My Recent Activity
                        </h3>
                    </div>
                    <div class="activity-list" id="activityList">
                        <!-- Activity items will be inserted here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="../js/admin-data.js"></script>
    <script src="../js/employee-profile.js"></script>
</body>

</html>
